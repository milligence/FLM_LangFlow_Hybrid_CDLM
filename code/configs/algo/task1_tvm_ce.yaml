# Fixed-teacher two-time finite-map student used by the 10k experiment.
name: task1_tvm_ce
backbone: dit
parameterization: mean
time_conditioning: true
T: 0
subs_masking: false
causal_attention: false
ignore_bos: false
t_max: 1.0
t_min: 0.0
double_temb: true
learnable_loss_weighting: false
state_space: vocab
corruption: flm_linear_gaussian
embedding_state: false
flm_time_eps: 1.0e-5
time_sampling: physical_r_s
training_time_sampling: tvm_normalized_gap_curriculum
model_time_condition: tau
normalize_embeddings: false
self_conditioning: true
self_condition_probability: 0.0
student_sc_mode: closed_no_sc
teacher_local_sc_mode: zero_sc
tokenwise_bias: true
token_bias_warmup_steps: 0
token_bias_schedule: full
classification_prototype_mode: direct_vocab_state
bias_interpretation: matched_flm_vocab_gaussian_direct
codebook_gradient_mode: all
loss_type: tvm_calibrated_relative_ce
prediction_target: frozen_teacher_tvm_quantity
output_transform: softmax_finite_denoiser
reduction: vocab_sum_then_valid_token_mean
time_weighting: sampled_pair_unit_weight
teacher_path: ''
initialize_student_from_teacher: true
tvm_inference_grid_physical: []
tvm_inference_mode: finite_map
tvm_inference_self_conditioning: off
tvm_teacher_s_max: 0.998046875
tvm_teacher_bias_weight: 1.0
tvm_kappa: 0.02
tvm_main_loss: calibrated_relative_ce
tvm_negative_mass_weight: 0.1
tvm_r0_probability: 0.35
tvm_training_budget_steps: 10000
tvm_curriculum_fraction: 0.10
tvm_endpoint_weight: 0.0
tvm_endpoint_teacher_sc_mode: zero_sc
