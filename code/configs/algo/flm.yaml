# for flm pretrain (only fm loss)

name: flm
backbone: dit  # dit / dimamba / hf_dit
parameterization: mean
time_conditioning: True
T: 0  
subs_masking: False
causal_attention: False
ignore_bos: False
t_max: 1.0
t_min: 0.0
double_temb: False
learnable_loss_weighting: False
loss_type: cross_entropy  # cross_entropy or mse
denoiser_output: simplex  # simplex or euclidean; CE requires simplex
loss_scale: 1.0
log_prediction_stats: False
